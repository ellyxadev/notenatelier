<style>
:root{--bg:#f7f4ee;--paper:#fffdf9;--ink:#263b39;--muted:#667772;--accent:#326e66;--pale:#e1eee8;--gold:#c39153;--border:#e2e5dc;--bad:#a65047;--shadow:0 14px 45px #223c3310}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}header{max-width:1160px;margin:auto;padding:30px 28px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-family:Georgia,serif;font-size:27px;font-weight:700;letter-spacing:-.5px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:750;color:var(--accent)}.subtitle{font-size:14px;color:var(--muted)}.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 13px;border:1px solid var(--border);border-radius:99px;background:var(--paper);font-size:13px;color:var(--muted)}.layout{max-width:1160px;margin:auto;padding:0 28px 70px;display:grid;grid-template-columns:220px 1fr;gap:25px}nav{display:flex;flex-direction:column;gap:9px}nav button{border:0;background:transparent;color:var(--muted);border-radius:13px;padding:12px 15px;text-align:left;font-weight:650}nav button.active{background:var(--ink);color:white}nav button:hover:not(.active){background:#e9eae2}main{min-width:0}.panel{background:var(--paper);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:var(--shadow);margin-bottom:20px}h1,h2,h3{font-family:Georgia,serif;line-height:1.2;margin:0 0 12px}h1{font-size:clamp(30px,4vw,45px)}h2{font-size:25px}h3{font-size:20px}p{margin:0 0 14px;color:var(--muted)}.hero{padding:32px;background:linear-gradient(125deg,#e3eee7,#fffaf0 70%);border-radius:22px;border:1px solid var(--border);margin-bottom:20px}.hero p{max-width:620px}.btn{border:1px solid var(--accent);border-radius:12px;padding:11px 18px;background:var(--accent);color:white;font-weight:700}.btn.secondary{background:transparent;color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.mini{border:1px solid var(--border);padding:18px;border-radius:16px;background:white;min-width:0}.mini strong{display:block;font-size:19px;color:var(--ink);margin:5px 0}.mini p{font-size:13px}.kpi{font-size:30px;font-weight:800;color:var(--accent)}.lesson-list{display:grid;gap:13px}.lesson{background:white;border:1px solid var(--border);border-radius:16px;padding:17px 18px}.lesson-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.chip{color:var(--accent);background:var(--pale);font-size:12px;padding:3px 9px;border-radius:50px;font-weight:750}.note{border-left:3px solid var(--gold);background:#f8f4ed;padding:12px 14px;border-radius:0 12px 12px 0;margin:14px 0;color:var(--ink)}.staff-box{background:white;border:1px solid var(--border);border-radius:16px;padding:8px 16px;margin:18px 0;display:flex;align-items:center;justify-content:center;min-height:180px}.staff-box svg{width:100%;max-width:520px;height:auto;overflow:visible}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.option{border:1px solid var(--border);border-radius:12px;background:white;color:var(--ink);padding:12px 7px;font-weight:750}.option:hover:not(:disabled){border-color:var(--accent);background:var(--pale)}.option.correct{background:#d8ede0;border-color:#609979}.option.wrong{background:#f7dedb;border-color:#b86a60}.option:disabled{cursor:default}.feedback{min-height:40px;font-weight:650;color:var(--accent)}.feedback.bad{color:var(--bad)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}select{font:inherit;border:1px solid var(--border);border-radius:10px;background:white;padding:10px 12px;color:var(--ink)}.progressbar{height:9px;background:#e9ece5;border-radius:20px;overflow:hidden;margin:9px 0 3px}.progressbar>div{height:100%;background:var(--accent);transition:width .3s}.hidden{display:none!important}.muted{font-size:13px;color:var(--muted)}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tab{border:1px solid var(--border);background:white;color:var(--ink);padding:8px 13px;border-radius:10px}.tab.selected{background:var(--pale);border-color:var(--accent)}.kbd{display:flex;max-width:620px;height:144px;margin:18px auto 10px;position:relative;border:1px solid #d4d8d0;border-radius:7px;overflow:hidden}.whitekey{flex:1;background:linear-gradient(white,#e6e8e5);border-right:1px solid #bfc6bf;display:flex;align-items:end;justify-content:center;padding:0 2px 10px;font-size:12px;cursor:pointer;user-select:none}.whitekey:active,.whitekey.playing{background:#c5e2d6}.blackkey{position:absolute;top:0;height:58%;width:7.2%;background:#263b39;border-radius:0 0 5px 5px;z-index:2;cursor:pointer}.blackkey:active{background:#46766b}.reading{max-width:790px}.reading h3{margin-top:20px}.reading ul{color:var(--muted);padding-left:20px}.reading li{margin-bottom:6px}footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 20px 28px}@media(max-width:800px){header{padding:20px}.layout{display:block;padding:0 15px 35px}nav{flex-direction:row;overflow-x:auto;margin-bottom:15px;padding-bottom:5px}nav button{white-space:nowrap}header .pill{display:none}.panel{padding:18px}.hero{padding:24px}.grid{grid-template-columns:1fr}.options{grid-template-columns:repeat(2,1fr)}.brand{font-size:23px}}

.playtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.playtile{text-align:left;background:linear-gradient(145deg,#f1f7f1,#fffaf2);border:1px solid var(--border);border-radius:17px;padding:21px;color:var(--ink);display:flex;flex-direction:column;gap:5px;transition:transform .15s,border .15s}.playtile:hover{transform:translateY(-3px);border-color:var(--accent)}.playtile span{font-size:34px;color:var(--accent)}.playtile strong{font-family:Georgia,serif;font-size:20px}.playtile small{color:var(--muted)}.gamehead{display:flex;justify-content:space-between;align-items:center;gap:10px}.star{font-size:29px;color:#ab7737;font-weight:bold}.questchoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.questchoices button{background:#fff;border:2px solid var(--border);border-radius:15px;padding:16px;color:var(--ink);font-weight:750;min-height:60px}.questchoices button:hover:not(:disabled){border-color:var(--accent);background:var(--pale)}.questchoices button.correct{background:#d8ede0;border-color:#609979}.questchoices button.wrong{background:#f7dedb;border-color:#b86a60}.questfeedback{min-height:75px;font-weight:650}.lesson summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}.lesson summary::-webkit-details-marker{display:none}.lesson summary::before{content:"▸";color:var(--accent);font-size:19px}.lesson[open] summary::before{content:"▾"}.lesson summary h3{margin:0;flex:1}.lesson[open] summary{margin-bottom:17px}.questvisual{font-size:42px;text-align:center;padding:14px;border-radius:16px;background:#f8f4ed}.questvisual .staff-box{margin:0;background:transparent;border:0}.questactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.round-pips{display:flex;gap:5px;margin:12px 0 20px}.round-pips>span{height:7px;flex:1;border-radius:20px;background:#e3e8e0}.round-pips .done{background:#57987c}.round-pips .current{background:#bf9157}@media(max-width:600px){.playtiles{grid-template-columns:1fr}.questchoices{grid-template-columns:1fr}}
.learning-keys{display:flex;width:100%;height:115px;margin:12px 0;border:1px solid #ccd7cf;border-radius:8px;overflow:hidden}.learning-keys button{flex:1;min-width:0;border:0;border-right:1px solid #becdc2;background:linear-gradient(white,#e5eae5);color:#34594f;font:11px system-ui;padding:8px 1px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}.learning-keys button:active{background:#b5dacb}@media(max-width:600px){.learning-keys button{font-size:9px;writing-mode:vertical-rl;justify-content:flex-end}} </style></head>
<body><header><div><div class="eyebrow">Jouw muzikale leerplek</div><div class="brand">♫ Notenatelier</div><div class="subtitle">Van noten herkennen tot partituren begrijpen</div></div><div class="pill">♪ Oefenen op je eigen tempo</div></header>
<div class="layout"><nav aria-label="Navigatie"><button data-page="home" class="active">⌂ Overzicht</button><button data-page="quest">✦ Speelronde</button><button data-page="theory">▤ Lessen</button><button data-page="notes">♩ Noten lezen</button><button data-page="rhythm">◷ Ritme</button><button data-page="intervals">↗ Intervallen</button><button data-page="piano">♫ Pianohoek</button><button data-page="scores">▣ Partiturenlab</button></nav><main id="main"></main></div><footer>Notenatelier • Gratis en lokaal bruikbaar • Je vooruitgang wordt in deze browser bewaard</footer>
<script>
'use strict';
const $=(s)=>document.querySelector(s); const STORE='notenatelier-v1'; let state={};try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{};state.stats=state.stats||{notes:{right:0,total:0},rhythm:{right:0,total:0},intervals:{right:0,total:0}};state.completed=state.completed||[];
const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}};
const levels=[{name:'Basis',min:-2,max:10},{name:'Uitdagend',min:-6,max:14},{name:'Gevorderd',min:-10,max:18}];
// Diatonic step 0=C4; treble bottom staff E4 = 2; bass bottom staff G2 = -10
const letters=['C','D','E','F','G','A','B'];const dutch=['do','re','mi','fa','sol','la','si'];
function pitch(step){let idx=((step%7)+7)%7;let octave=4+Math.floor(step/7);return {letter:letters[idx],octave,sol:dutch[idx],step};}
function fullname(step){const n=pitch(step);return `${n.sol}${n.octave}`}
function keyToMidi(step){const n=pitch(step);const semi=[0,2,4,5,7,9,11][letters.indexOf(n.letter)];return 12*(n.octave+1)+semi;}
function playMidi(midi){try{const C=window.AudioContext||window.webkitAudioContext;window.audioCtx=window.audioCtx||new C();const a=window.audioCtx;if(a.state==='suspended')a.resume();const osc=a.createOscillator(),gain=a.createGain();osc.type='sine';osc.frequency.value=440*Math.pow(2,(midi-69)/12);gain.gain.setValueAtTime(.0001,a.currentTime);gain.gain.exponentialRampToValueAtTime(.19,a.currentTime+.018);gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.72);osc.connect(gain).connect(a.destination);osc.start();osc.stop(a.currentTime+.75)}catch(e){console.warn('Audio niet beschikbaar',e)}}
function nav(page){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));location.hash=page;render(page)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function title(t,desc){return `<div class="panel"><div class="eyebrow">Notenatelier</div><h1>${t}</h1><p>${desc}</p></div>`}
const main=$('#main');state.arcade=state.arcade||{best:0,runs:0};
function home(){const total=Object.values(state.stats).reduce((a,b)=>a+b.total,0),right=Object.values(state.stats).reduce((a,b)=>a+b.right,0);main.innerHTML=`<section class="hero"><div class="eyebrow">Notenatelier · jouw muzikale avontuur</div><h1>Hoor het. Zie het. Speel het.</h1><p>Geen eindeloze leerboekpagina's. Begin met een korte speelronde: herken noten, luister, ontdek ritmes en verzamel sterren. Een fout is gewoon een kans om iets te leren.</p><div class="btnrow"><button class="btn" id="start">✦ Start een speelronde</button><button class="btn secondary" id="learn">Ontdek de lessen</button></div></section><div class="grid"><div class="mini"><div class="eyebrow">Beste speelronde</div><div class="kpi">${state.arcade.best||0} ★</div><p>Op 10 uitdagingen</p></div><div class="mini"><div class="eyebrow">Al gespeeld</div><div class="kpi">${state.arcade.runs||0}</div><p>Korte speelrondes</p></div><div class="mini"><div class="eyebrow">Juist geoefend</div><div class="kpi">${total?Math.round(100*right/total):0}%</div><p>In de losse oefeningen</p></div></div><section class="panel"><h2>Kies wat je vandaag wilt ontdekken</h2><div class="playtiles"><button class="playtile" data-go="notes"><span>♪</span><strong>Notenjacht</strong><small>Vliegensvlug noten lezen</small></button><button class="playtile" data-go="piano"><span>♫</span><strong>Klankverkenner</strong><small>Leer met het klavier</small></button><button class="playtile" data-go="rhythm"><span>◷</span><strong>Ritmebreker</strong><small>Ontcijfer de maat</small></button><button class="playtile" data-go="intervals"><span>↗</span><strong>Intervaldetective</strong><small>Ontdek afstanden</small></button></div></section><section class="panel"><div class="eyebrow">Jouw langetermijndoel</div><h2>Van kleine patronen naar echte pianostukken</h2><p>Je werkt toe naar de vaardigheden voor muziek van Einaudi en Tiersen. Je hoeft daarvoor niet eerst alle theorie uit je hoofd te leren: speel, ontdek waarom het werkt en herhaal.</p><button class="btn secondary" id="journey">Bekijk je leerroute</button></section>`;$('#start').onclick=()=>nav('quest');$('#learn').onclick=()=>nav('theory');$('#journey').onclick=()=>nav('theory');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go))}
const lessons=[
{title:'De notenbalk en de sleutels',body:`Een notenbalk heeft <b>vijf lijnen en vier tussenruimtes</b>. Hoe hoger een noot staat, hoe hoger ze klinkt. De <b>vioolsleutel</b> duidt de sol op de tweede lijn van onder aan. De <b>bassleutel</b> duidt de fa op de tweede lijn van boven aan.<div class="note">Vioolsleutel, lijnen van onder naar boven: mi – sol – si – re – fa. Tussenruimtes: fa – la – do – mi.<br>Bassleutel, lijnen van onder naar boven: sol – si – re – fa – la. Tussenruimtes: la – do – mi – sol.</div>`},
{title:'Notennamen en octaven',body:`De zeven notennamen zijn <b>do – re – mi – fa – sol – la – si</b>. Na si komt opnieuw do. Het cijfer duidt het octaaf aan: <b>do4</b> is de centrale do op de piano en <b>do5</b> klinkt een octaaf hoger.`},
{title:'Kruisen, mollen en herstellingstekens',body:`Een <b>kruis (♯)</b> verhoogt een noot met één halve toon. Een <b>mol (♭)</b> verlaagt met één halve toon. Een <b>herstellingsteken (♮)</b> heft een eerdere verhoging of verlaging op. Een voorteken bij een noot geldt doorgaans voor dezelfde toonhoogte in de rest van de maat, tenzij een ander voorteken ingrijpt.<div class="note">Voorbeelden: fa♯ (fa kruis) en si♭ (si mol). Op een piano zit tussen mi en fa, en tussen si en do, telkens maar een halve toon.</div>`},
{title:'Ritme en notenwaarden',body:`In een gewone maatsoort waarin de kwartnoot één tel telt, duurt een <b>hele noot vier tellen</b>, een <b>halve noot twee</b>, een <b>kwartnoot één</b> en een <b>achtste noot een halve tel</b>. Een punt achter een noot verlengt haar duur met de helft. Een gepunteerde halve noot is dus drie tellen.`},
{title:'Maatsoorten begrijpen',body:`Bij <b>4/4</b> zijn er vier kwartnoten aan tijd per maat. Bij <b>3/4</b> zijn dat er drie. Bij <b>6/8</b> zijn er zes achtsten per maat, vaak gevoeld als twee groepen van drie achtsten. De onderste waarde vertelt de noteneenheid; het bovenste getal hoeveel van die eenheden in een maat passen.`},
{title:'Intervallen en toonafstanden',body:`Een interval is de afstand tussen twee tonen. Tel de <b>notennamen inclusief begin- en eindtoon</b>: do–re is een secunde, do–mi een terts, do–fa een kwart, do–sol een kwint en do–do (een octaaf hoger) een octaaf. Groot, klein, rein, verminderd of overmatig hangt af van de exacte halve tonen. Hier trainen we eerst de <b>intervalnummers</b>.`}
];
lessons.push(
{"title":"Halve en hele tonen","body":"<p>Een halve toon is de afstand tussen aangrenzende toetsen. Een hele toon is twee halve tonen. Tussen mi–fa en si–do ligt één halve toon.</p><div class=\"note\"><b>Aan de piano:</b> Speel do–re, daarna mi–fa. Hoor het verschil en zoek fa♯ op je klavier.</div>","q":"Hoeveel halve tonen zijn er tussen mi en fa?","options":["Eén","Twee","Drie"],"answer":0},
{"title":"Toonladders majeur en mineur","body":"<p>Majeur volgt heel–heel–half–heel–heel–heel–half. Do majeur gebruikt do–re–mi–fa–sol–la–si. Natuurlijke mineur volgt heel–half–heel–heel–half–heel–heel. La mineur heeft dezelfde witte toetsen maar een andere grondtoon.</p><div class=\"note\"><b>Aan de piano:</b> Speel do majeur en la mineur op en neer. Noem telkens elke noot.</div>","q":"Welke stappen beginnen een majeurtoonladder?","options":["Heel–heel–half","Half–heel–heel","Heel–half–heel"],"answer":0},
{"title":"Toonaarden en voortekening","body":"<p>De voortekening bepaalt welke tonen standaard verhoogd of verlaagd zijn. Eén kruis geeft fa♯ aan en past bij sol majeur of mi mineur. Eén mol geeft si♭ aan en past bij fa majeur of re mineur. De voortekening vertelt niet op zichzelf of het stuk majeur of mineur is.</p><div class=\"note\"><b>Aan de piano:</b> Zoek in een eigen partituur alle kruisen of mollen voor de maatsoort.</div>","q":"Welke noot wordt verhoogd door één kruis aan de sleutel?","options":["fa","sol","do"],"answer":0},
{"title":"Intervallen verdiepen","body":"<p>Bij intervallen telt eerst het aantal notennamen. De kwaliteit hangt af van halve tonen. Do–mi is een grote terts, do–mi♭ een kleine terts; do–sol een reine kwint.</p><div class=\"note\"><b>Aan de piano:</b> Speel do–mi en do–mi♭ na elkaar. Luister naar het verschil.</div>","q":"Wat is do–mi♭?","options":["Kleine terts","Grote terts","Reine kwart"],"answer":0},
{"title":"Akkoorden en drieklanken","body":"<p>Een drieklank bestaat uit grondtoon, terts en kwint. Do majeur is do–mi–sol. Do mineur is do–mi♭–sol. Akkoorden zijn bouwblokken van begeleiding en harmonie.</p><div class=\"note\"><b>Aan de piano:</b> Speel beide do-akkoorden en beschrijf hoe ze verschillen.</div>","q":"Welke tonen vormen do majeur?","options":["do–mi–sol","do–mi♭–sol","do–fa–sol"],"answer":0},
{"title":"Omgekeerde akkoorden","body":"<p>Een akkoord kan dezelfde tonen in een andere volgorde hebben. Do–mi–sol is grondligging, mi–sol–do de eerste omkering, sol–do–mi de tweede omkering. Omkeringen maken soepele overgangen mogelijk.</p><div class=\"note\"><b>Aan de piano:</b> Speel de drie liggingen van do majeur langzaam achter elkaar.</div>","q":"Welke is de eerste omkering van do–mi–sol?","options":["mi–sol–do","sol–do–mi","do–sol–mi"],"answer":0},
{"title":"Arpeggio's en begeleidingsfiguren","body":"<p>Een arpeggio speelt akkoordtonen na elkaar in plaats van tegelijk. Bijvoorbeeld do–mi–sol–do. Als je de onderliggende drieklank herkent, hoef je de losse noten niet één voor één te onthouden.</p><div class=\"note\"><b>Aan de piano:</b> Speel links do–sol–mi–sol herhaald. Dit is een eigen oefenpatroon, niet uit een bestaand werk.</div>","q":"Wat gebeurt bij een arpeggio?","options":["Akkoordtonen klinken na elkaar","Akkoordtonen moeten tegelijk klinken","De grondtoon verdwijnt altijd"],"answer":0},
{"title":"Ostinato en muzikale motieven","body":"<p>Een ostinato is een terugkerend patroon. Een motief is een herkenbaar kort muzikaal idee. Veel minimalistische pianomuziek bouwt op herhaling en subtiele variatie.</p><div class=\"note\"><b>Aan de piano:</b> Speel links vier keer hetzelfde patroon; verander in de vierde ronde één noot.</div>","q":"Wat is een ostinato?","options":["Een terugkerend patroon","Een tempowisseling","Een drieklank"],"answer":0},
{"title":"Rusten en overbindingen","body":"<p>Een rust betekent stilte met een bepaalde duur. Een overbinding verbindt noten van dezelfde toonhoogte tot één lange klank. Achtsten verdeel je vaak als één-en, twee-en.</p><div class=\"note\"><b>Aan de piano:</b> Tik vier tellen en laat de tweede stil. Houd daarna één noot twee tellen aan.</div>","q":"Wat doet een overbinding?","options":["Ze verlengt de klinkende duur","Ze verhoogt de toon","Ze versnelt het tempo"],"answer":0},
{"title":"Maatsoorten en de puls","body":"<p>Bij 3/4 tel je gewoonlijk drie kwartslagen. Bij 6/8 zijn er zes achtsten, vaak gegroepeerd als twee groepen van drie. De gevoelde puls is dus anders.</p><div class=\"note\"><b>Aan de piano:</b> Tik één-twee-drie, vier-vijf-zes en accentueer één en vier.</div>","q":"Hoe voelt 6/8 vaak?","options":["Twee groepen van drie achtsten","Drie groepen van twee kwarten","Zes groepen van twee achtsten"],"answer":0},
{"title":"Beide handen coördineren","body":"<p>Leer elke hand apart, zoek waar de noten op dezelfde tel samenvallen en combineer langzaam. Handonafhankelijkheid ontstaat door gecontroleerde coördinatie, niet door meteen op volle snelheid te spelen.</p><div class=\"note\"><b>Aan de piano:</b> Speel links vier kwartnoten; rechts op tel twee twee achtsten. Blijf ontspannen.</div>","q":"Wat helpt bij een lastige combinatie?","options":["Langzaam samenbrengen rond de tel","Meteen versnellen","Links voortdurend luider spelen"],"answer":0},
{"title":"Legato, dynamiek en frasering","body":"<p>Legato betekent verbonden, staccato betekent korter en los. Dynamiek is de geluidssterkte; frasering geeft richting aan muzikale zinnen. Laat de melodie hoorbaar boven de begeleiding uitkomen.</p><div class=\"note\"><b>Aan de piano:</b> Speel rechts vijf noten legato en links zacht. Wissel de rollen om.</div>","q":"Wat betekent legato?","options":["Vloeiend verbonden spelen","Alle noten even hard","Elke noot kort afbreken"],"answer":0},

// Staff SVG has 14px per diatonic step. Note y = bottom line minus difference * 7.
function staffSVG(step,clef='treble',second=null){const bottom=clef==='treble'?2:-10;const yFor=s=>133-(s-bottom)*9;const lineY=[61,79,97,115,133];const note=(s,x)=>{const y=yFor(s);let ledger='';for(let j=bottom-2;j>=s;j-=2)ledger+=`<line x1="${x-18}" x2="${x+18}" y1="${yFor(j)}" y2="${yFor(j)}" stroke="#4d5b56" stroke-width="1.7"/>`;for(let j=bottom+10;j<=s;j+=2)ledger+=`<line x1="${x-18}" x2="${x+18}" y1="${yFor(j)}" y2="${yFor(j)}" stroke="#4d5b56" stroke-width="1.7"/>`;return `${ledger}<ellipse cx="${x}" cy="${y}" rx="13" ry="9" transform="rotate(-18 ${x} ${y})" fill="#2e5b54"/><line x1="${x+12}" y1="${y-2}" x2="${x+12}" y2="${y-51}" stroke="#2e5b54" stroke-width="2.5"/>`};let symbol=clef==='treble'?`<text x="57" y="143" font-size="91" fill="#3b5e55" font-family="serif">𝄞</text>`:`<text x="55" y="101" font-size="66" fill="#3b5e55" font-family="serif">𝄢</text>`;return `<svg role="img" aria-label="${clef==='treble'?'Vioolsleutel':'Bassleutel'} met ${second===null?'één noot':'twee noten'}" viewBox="0 0 440 204" xmlns="http://www.w3.org/2000/svg">${lineY.map(y=>`<line x1="38" x2="410" y1="${y}" y2="${y}" stroke="#a7b4ac" stroke-width="1.5"/>`).join('')}${symbol}${note(step,second===null?225:205)}${second!==null?note(second,310):''}</svg>`}

const lessonExtraQuestions=[[["Hoeveel lijnen heeft een notenbalk?","5","4","6"],["Waar staat sol in de vioolsleutel?","Tweede lijn van onder","Onderste lijn","Bovenste lijn"],["Waar staat fa in de bassleutel?","Tweede lijn van boven","Onderste lijn","Middelste lijn"]],[["Welke noot volgt op si?","do","re","la"],["Welke noot volgt op mi?","fa","sol","re"],["Welke noot staat tussen sol en si?","la","fa","do"]],[["Wat doet een kruis?","Verhoogt een halve toon","Verlaagt een halve toon","Verhoogt een hele toon"],["Wat doet een mol?","Verlaagt een halve toon","Verhoogt een halve toon","Verlaagt een hele toon"],["Wat doet een herstellingsteken?","Heft een wijziging op","Maakt een toon langer","Verlaagt een hele toon"]],[["Hoeveel tellen duurt een hele noot bij kwartnoot = 1 tel?","4","2","3"],["Hoe lang duurt een achtste noot?","0,5 tel","1 tel","2 tellen"],["Hoe lang duurt een gepunteerde halve noot?","3 tellen","2 tellen","4 tellen"]],[["Hoeveel kwarttellen in 3/4?","3","4","6"],["Hoeveel kwarttellen in 4/4?","4","3","2"],["Hoeveel achtsten in 6/8?","6","3","8"]],[["Welk interval is do naar mi?","terts","secunde","kwart"],["Welk interval is do naar fa?","kwart","kwint","terts"],["Welk interval is do naar sol?","kwint","kwart","sext"]],[["Hoeveel halve tonen van mi naar fa?","1","2","3"],["Hoeveel halve tonen van do naar re?","2","1","3"],["Hoeveel halve tonen van si naar do?","1","2","3"]],[["Welk patroon begint majeur?","heel – heel – half","heel – half – heel","half – heel – heel"],["Welke is de grondtoon van la mineur?","la","do","mi"],["Welke toonladder heeft geen kruisen of mollen?","do majeur","sol majeur","fa majeur"]],[["Welke noot verhoogt één kruis?","fa","sol","do"],["Welke noot verlaagt één mol?","si","mi","la"],["Welke majeurtoonaard heeft één kruis?","sol majeur","fa majeur","do majeur"]],[["Do naar mi is welke terts?","grote terts","kleine terts","reine kwart"],["Do naar mi♭ is welke terts?","kleine terts","grote terts","reine kwint"],["Do naar sol is welke kwint?","reine kwint","kleine kwint","grote kwint"]],[["Welke drieklank is do majeur?","do – mi – sol","do – mi♭ – sol","do – fa – sol"],["Hoeveel verschillende tonen in een drieklank?","3","4","2"],["Welke toon is de kwint van do?","sol","mi","fa"]],[["Welke is de eerste omkering van do–mi–sol?","mi – sol – do","sol – do – mi","do – mi – sol"],["Welke is de tweede omkering?","sol – do – mi","mi – sol – do","do – mi – sol"],["Blijven de akkoordtonen bij een omkering dezelfde?","Ja","Nee","Alleen bij mineur"]],[["Wat is een arpeggio?","Akkoordtonen na elkaar","Akkoordtonen tegelijk","Een lange rust"],["Welke reeks gebruikt do-majeurakkoordtonen?","do – mi – sol – do","do – fa – la – do","do – re – fa – do"],["Waarom is een akkoordpatroon herkennen nuttig?","Minder losse noten onthouden","Minder ritme nodig","Geen vingerzetting nodig"]],[["Wat is een ostinato?","Herhaald muzikaal patroon","Een voorteken","Een maatsoort"],["Wat is een motief?","Kort herkenbaar muzikaal idee","Een hele symfonie","Een pedaal"],["Wat is een variatie?","Herkenbare verandering van een patroon","Altijd exact dezelfde noten","Een volledige rust"]],[["Hoeveel achtsten in een kwartnoot?","2","3","4"],["Wat betekent een kwart rust?","1 tel stilte","2 tellen stilte","4 tellen stilte"],["Wat doet een overbinding?","Voegt notenduren samen","Verhoogt een toon","Verandert het tempo"]],[["Hoeveel achtsten in 6/8?","6","3","4"],["Hoeveel hoofdslagen voelt 6/8 vaak?","2","3","6"],["Hoe lang duurt een gepunteerde kwartnoot?","1,5 tel","2 tellen","3 tellen"]],[["Hoe breng je twee handen samen?","Langzaam rond gedeelde tellen","Meteen versnellen","Pedaal vasthouden"],["Wat doe je met een foutgevoelige passage?","Kort fragment langzaam oefenen","Steeds sneller spelen","De fouten negeren"],["Hoe maak je de rechterhandmelodie duidelijk?","Linkerhand zachter","Linkerhand harder","Alleen pedaal gebruiken"]],[["Wat betekent legato?","Verbonden spelen","Kort en los","Luid"],["Wat betekent staccato?","Kort en los","Gebonden","Vertragen"],["Wat betekent crescendo?","Geleidelijk luider","Geleidelijk zachter","Vertragen"]],[["Wat doet het rechterpedaal?","Laat klanken resoneren","Verhoogt de noten","Verandert het tempo"],["Wat kan continu pedaal veroorzaken?","Troebele harmonie","Sneller tempo","Hogere tonen"],["Wanneer wissel je vaak van pedaal?","Bij harmoniewissels","Alleen aan het eind","Nooit"]],[["Welke vinger is nummer 1?","duim","wijsvinger","pink"],["Welke vinger is nummer 5?","pink","duim","ringvinger"],["Welke vinger is nummer 3?","middelvinger","duim","wijsvinger"]],[["Wat lees je eerst in een partituur?","Sleutels en maatsoort","Alleen de titel","Alleen de laatste noot"],["Wat helpt bij een herhaalde begeleiding?","Patronen markeren","Elke maat apart vergeten","Direct versnellen"],["Wat is een maatstreep?","Grens tussen maten","Een kruis","Een pedaalteken"]],[["Wat is actief ophalen?","Zonder spieken proberen","Alleen herlezen","Alleen luisteren"],["Wat is gespreide herhaling?","Oefenen met tussenpozen","Alles eenmaal leren","Alleen makkelijke vragen"],["Wat helpt bij een moeilijke maat?","Langzaam in stukjes oefenen","Meteen versnellen","Overslaan"]]];
function lessonRecord(i){return state.lessonDrills[i]||(state.lessonDrills[i]={asked:0,right:0,streak:0,best:0,mastered:false,last:-1})}
function lessonPiano(){let w=[60,62,64,65,67,69,71,72,74,76,77,79,81,83,84],n=['do4','re4','mi4','fa4','sol4','la4','si4','do5','re5','mi5','fa5','sol5','la5','si5','do6'];return '<div class="mini" style="margin-top:22px"><strong>Probeer op de piano</strong><p>Speel zelf een paar tonen. Dit klavier laat je de klanken ontdekken, los van je quizantwoord.</p><div class="learning-keys">'+w.map((v,i)=>'<button type="button" data-piano="'+v+'" aria-label="'+n[i]+'">'+n[i]+'</button>').join('')+'</div><div class="muted" id="piano-note">Klik op een toets om te luisteren.</div></div>'}
function lessonQuestionPool(i){let bank=lessonExtraQuestions[i].map(a=>({q:a[0],answer:a[1],options:shuffled(a.slice(1)),explain:'Het juiste antwoord is: '+a[1]+'.'}));if(lessons[i].q){bank.push({q:lessons[i].q,answer:lessons[i].options[lessons[i].answer],options:shuffled([...lessons[i].options]),explain:'Kijk terug naar de uitleg van deze les.'})}return bank}
function lessonDrill(i){i=+i;if(!Number.isInteger(i)||i<0||i>=lessons.length)return nav('theory');lessonInProgress=i;let p=lessonRecord(i),l=lessons[i];main.innerHTML=title('Les '+(i+1)+': '+l.title,'Een hele reeks oefeningen, op jouw tempo. Je hoeft niet alles in één keer te doen.')+'<section class="panel"><div class="eyebrow">Beheersing</div><h2 id="streakText">'+p.streak+' / 12 op rij juist</h2><div class="progressbar"><div id="streakFill" style="width:'+Math.min(100,p.streak/12*100)+'%"></div></div><p class="muted">Al '+p.asked+' antwoorden gegeven, waarvan '+p.right+' juist. Een fout of een gebruikte hint onderbreekt je reeks, maar niet je totale oefeningen.</p><div class="btnrow"><button class="btn secondary" id="viewLessonHelp">Bekijk de uitleg</button><button class="btn secondary" id="leaveLesson">Terug naar alle lessen</button></div><div id="lessonHelp" class="note hidden">'+l.body+'</div></section><section class="panel" id="lessonQuestionContainer"></section>';$('#viewLessonHelp').onclick=()=>$('#lessonHelp').classList.toggle('hidden');$('#leaveLesson').onclick=()=>nav('theory');showLessonExercise()}
function showLessonExercise(){let i=lessonInProgress,p=lessonRecord(i),bank=lessonQuestionPool(i),possible=bank.map((_,j)=>j).filter(j=>j!==p.last),ix=possible[rand(0,possible.length-1)];p.last=ix;lessonQuestion={...bank[ix],hint:false,locked:false};let q=lessonQuestion;$('#lessonQuestionContainer').innerHTML='<div class="eyebrow">Oefening '+(p.asked+1)+' · '+lessons[i].title+'</div><h2 style="margin-top:14px">'+q.q+'</h2><div class="questchoices">'+q.options.map((x,j)=>'<button data-lesson-choice="'+j+'">'+x+'</button>').join('')+'</div><button class="btn secondary" id="exerciseHint">Ik wil een hint</button><div class="questfeedback" id="exerciseFeedback" aria-live="polite">Probeer eerst zelf het antwoord te vinden.</div><button class="btn" id="exerciseNext" disabled>Volgende oefening →</button>'+lessonPiano();document.querySelectorAll('[data-lesson-choice]').forEach(b=>b.onclick=()=>checkLessonExercise(b));$('#exerciseHint').onclick=()=>{q.hint=true;$('#exerciseFeedback').textContent='Gebruik de uitleg bovenaan om de regel te vinden. Deze vraag telt dan niet mee voor je foutloze reeks.'};$('#exerciseNext').onclick=showLessonExercise;document.querySelectorAll('[data-piano]').forEach(b=>b.onclick=()=>{playMidi(+b.dataset.piano);$('#piano-note').textContent='Je speelde '+b.getAttribute('aria-label')})}
function checkLessonExercise(b){let q=lessonQuestion;if(!q||q.locked)return;q.locked=true;let p=lessonRecord(lessonInProgress),correct=q.options[+b.dataset.lessonChoice]===q.answer;p.asked++;if(correct)p.right++;p.streak=correct&&!q.hint?p.streak+1:0;p.best=Math.max(p.best,p.streak);if(p.streak>=12)p.mastered=true;persist();$('#streakText').textContent=p.streak+' / 12 op rij juist'+(p.mastered?' · Les beheerst':'');$('#streakFill').style.width=Math.min(100,p.streak/12*100)+'%';document.querySelectorAll('[data-lesson-choice]').forEach(el=>{el.disabled=true;if(q.options[+el.dataset.lessonChoice]===q.answer)el.classList.add('correct');else if(el===b)el.classList.add('wrong')});$('#exerciseFeedback').textContent=(correct?'Juist! ':'Nog niet helemaal. ')+q.explain+(q.hint?' Je gebruikte hulp, dus de foutloze reeks groeit niet.':'');$('#exerciseNext').disabled=false}
function theory(){let finished=lessons.filter((_,i)=>lessonRecord(i).mastered).length;main.innerHTML=title('Jouw leeravontuur','Geen lange theorieblokken meer: elke les is een oefenronde met een eigen piano.')+'<div class="panel"><h2>'+finished+' van '+lessons.length+' lessen beheerst</h2><div class="progressbar"><div style="width:'+(finished/lessons.length*100)+'%"></div></div><p>Om een les te beheersen, beantwoord je 12 vragen achter elkaar juist zonder hint. Fouten komen in volgende rondes opnieuw terug. Later herhalen blijft belangrijk.</p></div><div class="lesson-list">'+lessons.map((l,i)=>{let p=lessonRecord(i);return '<article class="lesson"><div class="lesson-title"><h3>'+(i+1)+'. '+l.title+'</h3><span class="chip">'+(p.mastered?'Beheerst':p.streak+' / 12')+'</span></div><div class="progressbar"><div style="width:'+Math.min(100,p.streak/12*100)+'%"></div></div><p>'+p.asked+' oefeningen gemaakt · '+p.right+' juist</p><button class="btn" data-start-lesson="'+i+'">'+(p.asked?'Verder oefenen':'Start oefeningen')+'</button><details style="margin-top:14px"><summary>Bekijk eerst de theorie</summary><div style="padding-top:14px">'+l.body+'</div></details></article>'}).join('')+'</div>';document.querySelectorAll('[data-start-lesson]').forEach(b=>b.onclick=()=>{location.hash='lesson-'+b.dataset.startLesson;lessonDrill(+b.dataset.startLesson)})}

function render(page){(page.startsWith('lesson-')?()=>lessonDrill(+page.slice(7)):({home,quest,theory,notes,rhythm,intervals,piano,scores}[page]||home))();window.scrollTo({top:0,behavior:'instant'})}let initial=(location.hash||'#home').slice(1);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===initial));render(initial);window.addEventListener('hashchange',()=>{let page=(location.hash||'#home').slice(1);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render(page)});
</script></body></html>
