<html lang="nl">
<head>

<style>
:root{--bg:#f7f4ee;--paper:#fffdf9;--ink:#263b39;--muted:#667772;--accent:#326e66;--pale:#e1eee8;--gold:#c39153;--border:#e2e5dc;--bad:#a65047;--shadow:0 14px 45px #223c3310}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}header{max-width:1160px;margin:auto;padding:30px 28px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-family:Georgia,serif;font-size:27px;font-weight:700;letter-spacing:-.5px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:750;color:var(--accent)}.subtitle{font-size:14px;color:var(--muted)}.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 13px;border:1px solid var(--border);border-radius:99px;background:var(--paper);font-size:13px;color:var(--muted)}.layout{max-width:1160px;margin:auto;padding:0 28px 70px;display:grid;grid-template-columns:220px 1fr;gap:25px}nav{display:flex;flex-direction:column;gap:9px}nav button{border:0;background:transparent;color:var(--muted);border-radius:13px;padding:12px 15px;text-align:left;font-weight:650}nav button.active{background:var(--ink);color:white}nav button:hover:not(.active){background:#e9eae2}main{min-width:0}.panel{background:var(--paper);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:var(--shadow);margin-bottom:20px}h1,h2,h3{font-family:Georgia,serif;line-height:1.2;margin:0 0 12px}h1{font-size:clamp(30px,4vw,45px)}h2{font-size:25px}h3{font-size:20px}p{margin:0 0 14px;color:var(--muted)}.hero{padding:32px;background:linear-gradient(125deg,#e3eee7,#fffaf0 70%);border-radius:22px;border:1px solid var(--border);margin-bottom:20px}.hero p{max-width:620px}.btn{border:1px solid var(--accent);border-radius:12px;padding:11px 18px;background:var(--accent);color:white;font-weight:700}.btn.secondary{background:transparent;color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.mini{border:1px solid var(--border);padding:18px;border-radius:16px;background:white;min-width:0}.mini strong{display:block;font-size:19px;color:var(--ink);margin:5px 0}.mini p{font-size:13px}.kpi{font-size:30px;font-weight:800;color:var(--accent)}.lesson-list{display:grid;gap:13px}.lesson{background:white;border:1px solid var(--border);border-radius:16px;padding:17px 18px}.lesson-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.chip{color:var(--accent);background:var(--pale);font-size:12px;padding:3px 9px;border-radius:50px;font-weight:750}.note{border-left:3px solid var(--gold);background:#f8f4ed;padding:12px 14px;border-radius:0 12px 12px 0;margin:14px 0;color:var(--ink)}.staff-box{background:white;border:1px solid var(--border);border-radius:16px;padding:8px 16px;margin:18px 0;display:flex;align-items:center;justify-content:center;min-height:180px}.staff-box svg{width:100%;max-width:520px;height:auto;overflow:visible}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.option{border:1px solid var(--border);border-radius:12px;background:white;color:var(--ink);padding:12px 7px;font-weight:750}.option:hover:not(:disabled){border-color:var(--accent);background:var(--pale)}.option.correct{background:#d8ede0;border-color:#609979}.option.wrong{background:#f7dedb;border-color:#b86a60}.option:disabled{cursor:default}.feedback{min-height:40px;font-weight:650;color:var(--accent)}.feedback.bad{color:var(--bad)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}select{font:inherit;border:1px solid var(--border);border-radius:10px;background:white;padding:10px 12px;color:var(--ink)}.progressbar{height:9px;background:#e9ece5;border-radius:20px;overflow:hidden;margin:9px 0 3px}.progressbar>div{height:100%;background:var(--accent);transition:width .3s}.hidden{display:none!important}.muted{font-size:13px;color:var(--muted)}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tab{border:1px solid var(--border);background:white;color:var(--ink);padding:8px 13px;border-radius:10px}.tab.selected{background:var(--pale);border-color:var(--accent)}.kbd{display:flex;max-width:620px;height:144px;margin:18px auto 10px;position:relative;border:1px solid #d4d8d0;border-radius:7px;overflow:hidden}.whitekey{flex:1;background:linear-gradient(white,#e6e8e5);border-right:1px solid #bfc6bf;display:flex;align-items:end;justify-content:center;padding:0 2px 10px;font-size:12px;cursor:pointer;user-select:none}.whitekey:active,.whitekey.playing{background:#c5e2d6}.blackkey{position:absolute;top:0;height:58%;width:7.2%;background:#263b39;border-radius:0 0 5px 5px;z-index:2;cursor:pointer}.blackkey:active{background:#46766b}.reading{max-width:790px}.reading h3{margin-top:20px}.reading ul{color:var(--muted);padding-left:20px}.reading li{margin-bottom:6px}footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 20px 28px}@media(max-width:800px){header{padding:20px}.layout{display:block;padding:0 15px 35px}nav{flex-direction:row;overflow-x:auto;margin-bottom:15px;padding-bottom:5px}nav button{white-space:nowrap}header .pill{display:none}.panel{padding:18px}.hero{padding:24px}.grid{grid-template-columns:1fr}.options{grid-template-columns:repeat(2,1fr)}.brand{font-size:23px}}
</style></head>
<body><header><div><div class="eyebrow">Jouw muzikale leerplek</div><div class="brand">♫ Notenatelier</div><div class="subtitle">Van noten herkennen tot partituren begrijpen</div></div><div class="pill">♪ Oefenen op je eigen tempo</div></header>
<div class="layout"><nav aria-label="Navigatie"><button data-page="home" class="active">⌂ Overzicht</button><button data-page="theory">▤ Theorie</button><button data-page="notes">♩ Noten lezen</button><button data-page="rhythm">◷ Ritme</button><button data-page="intervals">↗ Intervallen</button><button data-page="piano">♫ Pianohoek</button><button data-page="scores">▣ Partiturenlab</button></nav><main id="main"></main></div><footer>Notenatelier • Gratis en lokaal bruikbaar • Je vooruitgang wordt in deze browser bewaard</footer>
<script>
'use strict';
const $=(s)=>document.querySelector(s); const STORE='notenatelier-v1'; let state={};try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch{};state.stats=state.stats||{notes:{right:0,total:0},rhythm:{right:0,total:0},intervals:{right:0,total:0}};state.completed=state.completed||[];
const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}};
const levels=[{name:'Basis',min:-2,max:10},{name:'Uitdagend',min:-6,max:14},{name:'Gevorderd',min:-10,max:18}];
// Diatonic step 0=C4; treble bottom staff E4 = 2; bass bottom staff G2 = -10
const letters=['C','D','E','F','G','A','B'];const dutch=['do','re','mi','fa','sol','la','si'];
function pitch(step){let idx=((step%7)+7)%7;let octave=4+Math.floor(step/7);return {letter:letters[idx],octave,sol:dutch[idx],step};}
function fullname(step){const n=pitch(step);return `${n.letter}${n.octave}`}
function keyToMidi(step){const n=pitch(step);const semi=[0,2,4,5,7,9,11][letters.indexOf(n.letter)];return 12*(n.octave+1)+semi;}
function playMidi(midi){try{const C=window.AudioContext||window.webkitAudioContext;window.audioCtx=window.audioCtx||new C();const a=window.audioCtx;if(a.state==='suspended')a.resume();const osc=a.createOscillator(),gain=a.createGain();osc.type='sine';osc.frequency.value=440*Math.pow(2,(midi-69)/12);gain.gain.setValueAtTime(.0001,a.currentTime);gain.gain.exponentialRampToValueAtTime(.19,a.currentTime+.018);gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.72);osc.connect(gain).connect(a.destination);osc.start();osc.stop(a.currentTime+.75)}catch(e){console.warn('Audio niet beschikbaar',e)}}
function nav(page){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));location.hash=page;render(page)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function title(t,desc){return `<div class="panel"><div class="eyebrow">Notenatelier</div><h1>${t}</h1><p>${desc}</p></div>`}
const main=$('#main');
function home(){const total=Object.values(state.stats).reduce((a,b)=>a+b.total,0),right=Object.values(state.stats).reduce((a,b)=>a+b.right,0);main.innerHTML=`<section class="hero"><div class="eyebrow">Welkom terug</div><h1>Muziek leren lezen, stap voor stap.</h1><p>Begrijp wat je speelt, herken noten sneller en maak van muziekstukken geen raadsel meer. Begin eenvoudig en verhoog zelf de uitdaging.</p><div class="btnrow"><button class="btn" id="start">Start noten oefenen</button><button class="btn secondary" id="learn">Bekijk de theorie</button></div></section><div class="grid"><div class="mini"><div class="eyebrow">Oefeningen gemaakt</div><div class="kpi">${total}</div><p>Alle oefeningen samen</p></div><div class="mini"><div class="eyebrow">Juist beantwoord</div><div class="kpi">${total?Math.round(100*right/total):'0'}%</div><p>Je totaalscore</p></div><div class="mini"><div class="eyebrow">Theorie afgerond</div><div class="kpi">${state.completed.length}/6</div><p>Korte leerhoofdstukken</p></div></div><div class="panel"><h2>Jouw leerroute</h2><div class="lesson-list"><div class="lesson"><strong>1. Begrijp de notenbalk</strong><p>Notennamen, sleutels, toonhoogte en het verschil tussen do en C.</p></div><div class="lesson"><strong>2. Train je ogen</strong><p>Herken noten op viool- en bassleutel, ook met hulplijntjes.</p></div><div class="lesson"><strong>3. Ontdek het ritme</strong><p>Notenwaarden, maatsoorten en rekensommen in 4/4.</p></div><div class="lesson"><strong>4. Zie verbanden</strong><p>Intervallen en later echte partituren analyseren.</p></div></div></div>`;$('#start').onclick=()=>nav('notes');$('#learn').onclick=()=>nav('theory')}
const lessons=[
{title:'De notenbalk en de sleutels',body:`Een notenbalk heeft <b>vijf lijnen en vier tussenruimtes</b>. Hoe hoger een noot staat, hoe hoger ze klinkt. De <b>vioolsleutel</b> duidt de G op de tweede lijn van onder aan. De <b>bassleutel</b> duidt de F op de tweede lijn van boven aan.<div class="note">Vioolsleutel, lijnen van onder naar boven: E – G – B – D – F. Tussenruimtes: F – A – C – E.<br>Bassleutel, lijnen van onder naar boven: G – B – D – F – A. Tussenruimtes: A – C – E – G.</div>`},
{title:'Notennamen en octaven',body:`De zeven stamtonen heten in letters <b>C D E F G A B</b> en in solmisatie <b>do re mi fa sol la si</b>. Na B begint opnieuw C. Het cijfer duidt het octaaf aan: <b>C4</b> is de centrale do op de piano. In de Nederlandse benaming wordt B soms als 'si' gezongen, niet verwarren met de Duitse notatie H.`},
{title:'Kruisen, mollen en herstellingstekens',body:`Een <b>kruis (♯)</b> verhoogt een noot met één halve toon. Een <b>mol (♭)</b> verlaagt met één halve toon. Een <b>herstellingsteken (♮)</b> heft een eerdere verhoging of verlaging op. Een voorteken bij een noot geldt doorgaans voor dezelfde toonhoogte in de rest van de maat, tenzij een ander voorteken ingrijpt.<div class="note">Voorbeelden: F♯ is fis; B♭ is bes. Op een piano is de afstand E–F en B–C telkens al een halve toon.</div>`},
{title:'Ritme en notenwaarden',body:`In een gewone maatsoort waarin de kwartnoot één tel telt, duurt een <b>hele noot vier tellen</b>, een <b>halve noot twee</b>, een <b>kwartnoot één</b> en een <b>achtste noot een halve tel</b>. Een punt achter een noot verlengt haar duur met de helft. Een gepunteerde halve noot is dus drie tellen.`},
{title:'Maatsoorten begrijpen',body:`Bij <b>4/4</b> zijn er vier kwartnoten aan tijd per maat. Bij <b>3/4</b> zijn dat er drie. Bij <b>6/8</b> zijn er zes achtsten per maat, vaak gevoeld als twee groepen van drie achtsten. De onderste waarde vertelt de noteneenheid; het bovenste getal hoeveel van die eenheden in een maat passen.`},
{title:'Intervallen en toonafstanden',body:`Een interval is de afstand tussen twee tonen. Tel de <b>letterbenamingen inclusief begin- en eindtoon</b>: C–D is een secunde, C–E een terts, C–F een kwart, C–G een kwint en C–C (een octaaf hoger) een octaaf. Groot, klein, rein, verminderd of overmatig hangt af van de exacte halve tonen. Hier trainen we eerst de <b>intervalnummers</b>.`}
];
function theory(){main.innerHTML=title('Theorie, helder uitgelegd','Zes korte hoofdstukken, van fundamentele begrippen tot intervallen. Neem ze gerust in een andere volgorde.')+`<div class="panel reading"><div class="lesson-list">${lessons.map((l,i)=>`<article class="lesson"><div class="lesson-title"><h3>${i+1}. ${l.title}</h3><span class="chip">${state.completed.includes(i)?'Gelezen':'Nieuw'}</span></div><div>${l.body}</div><button class="btn secondary" data-complete="${i}">${state.completed.includes(i)?'Markeer als niet gelezen':'Markeer als gelezen'}</button></article>`).join('')}</div></div>`;document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let i=+b.dataset.complete;state.completed=state.completed.includes(i)?state.completed.filter(x=>x!==i):[...state.completed,i];persist();theory()})}
// Staff SVG has 14px per diatonic step. Note y = bottom line minus difference * 7.
function staffSVG(step,clef='treble',second=null){const bottom=clef==='treble'?2:-10;const yFor=s=>133-(s-bottom)*9;const lineY=[61,79,97,115,133];const note=(s,x)=>{const y=yFor(s);let ledger='';for(let j=bottom-2;j>=s;j-=2)ledger+=`<line x1="${x-18}" x2="${x+18}" y1="${yFor(j)}" y2="${yFor(j)}" stroke="#4d5b56" stroke-width="1.7"/>`;for(let j=bottom+10;j<=s;j+=2)ledger+=`<line x1="${x-18}" x2="${x+18}" y1="${yFor(j)}" y2="${yFor(j)}" stroke="#4d5b56" stroke-width="1.7"/>`;return `${ledger}<ellipse cx="${x}" cy="${y}" rx="13" ry="9" transform="rotate(-18 ${x} ${y})" fill="#2e5b54"/><line x1="${x+12}" y1="${y-2}" x2="${x+12}" y2="${y-51}" stroke="#2e5b54" stroke-width="2.5"/>`};let symbol=clef==='treble'?`<text x="57" y="143" font-size="91" fill="#3b5e55" font-family="serif">𝄞</text>`:`<text x="55" y="101" font-size="66" fill="#3b5e55" font-family="serif">𝄢</text>`;return `<svg role="img" aria-label="${clef==='treble'?'Vioolsleutel':'Bassleutel'} met ${second===null?'één noot':'twee noten'}" viewBox="0 0 440 204" xmlns="http://www.w3.org/2000/svg">${lineY.map(y=>`<line x1="38" x2="410" y1="${y}" y2="${y}" stroke="#a7b4ac" stroke-width="1.5"/>`).join('')}${symbol}${note(step,second===null?225:205)}${second!==null?note(second,310):''}</svg>`}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function makeNoteQuestion(){let clef=$('#clefSelect').value; if(clef==='both')clef=Math.random()<.5?'treble':'bass';const lv=+$('#levelSelect').value,base=clef==='treble'?2:-10;let st=base+rand(levels[lv].min,levels[lv].max),correct=fullname(st),choices=new Set([correct]);while(choices.size<4){const other=st+rand(-7,7);if(other!==st)choices.add(fullname(other))};return {clef,step:st,answer:correct,options:shuffled([...choices]),explain:`Dit is ${pitch(st).letter}${pitch(st).octave}, oftewel ${pitch(st).sol} in octaaf ${pitch(st).octave}.`}}
let question=null,locked=false;
function quizLayout(kind,heading,desc,controls){const s=state.stats[kind];main.innerHTML=title(heading,desc)+`<section class="panel"><div class="toolbar">${controls}</div><div id="quizArea"></div><div class="muted" id="progressStat">${s.right} juist op ${s.total} beantwoorde vragen</div><div class="progressbar"><div style="width:${s.total?Math.round(s.right/s.total*100):0}%"></div></div></section>`}
function showQuestion(kind){locked=false;let area=$('#quizArea');if(kind==='notes'){question=makeNoteQuestion();area.innerHTML=`<div class="eyebrow" style="margin-top:22px">${question.clef==='treble'?'Vioolsleutel':'Bassleutel'} · Welke noot zie je?</div><div class="staff-box">${staffSVG(question.step,question.clef)}</div><div class="options">${question.options.map(o=>`<button class="option" data-value="${o}">${o}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="btnrow"><button id="hear" class="btn secondary">♪ Hoor de noot</button><button id="next" class="btn" disabled>Volgende noot →</button></div>`;$('#hear').onclick=()=>playMidi(keyToMidi(question.step))}
if(kind==='rhythm'){const types=[{name:'hele noot',val:4},{name:'halve noot',val:2},{name:'kwartnoot',val:1},{name:'achtste noot',val:.5},{name:'gepunteerde halve noot',val:3},{name:'gepunteerde kwartnoot',val:1.5}];let a=types[rand(0,types.length-1)],b=types[rand(0,types.length-1)];let mode=rand(0,1);let answer=mode?a.val+b.val:a.val;let opts=new Set([String(answer).replace('.',',')]);for(let v of shuffled([.5,1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6,7,8])){if(opts.size>=4)break;if(v!==answer)opts.add(String(v).replace('.',','))};question={answer:String(answer).replace('.',','),options:shuffled([...opts]),explain:`${a.name} = ${a.val} tel(len)${mode?`; ${b.name} = ${b.val} tel(len). Samen ${answer}.`:'.'}`};area.innerHTML=`<div class="eyebrow" style="margin-top:24px">Ritme rekenen · Kwartnoot = 1 tel</div><h2 style="margin-top:16px">Hoeveel tellen ${mode?'duren deze twee noten samen':'duurt deze noot'}?</h2><div class="mini" style="text-align:center;font-size:25px;margin:18px 0">${a.name}${mode?' + '+b.name:''}</div><div class="options">${question.options.map(o=>`<button class="option" data-value="${o}">${o}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="btn" disabled>Volgende vraag →</button>`}
if(kind==='intervals'){let a=rand(0,7),distance=rand(1,8),b=a+distance-1;let names=['prime','secunde','terts','kwart','kwint','sext','septiem','octaaf'];let opts=new Set([names[distance-1]]);while(opts.size<4)opts.add(names[rand(0,7)]);question={answer:names[distance-1],options:shuffled([...opts]),explain:`Tel inclusief begin- en eindnoot: ${distance} toontrappen. Dat heet een ${names[distance-1]}.`};area.innerHTML=`<div class="eyebrow" style="margin-top:22px">Intervallen · Tel de toontrappen</div><div class="staff-box">${staffSVG(a,'treble',b)}</div><div class="muted">Van ${fullname(a)} naar ${fullname(b)}. We vragen naar het intervalnummer, niet naar groot, klein of rein.</div><div class="options">${question.options.map(o=>`<button class="option" data-value="${o}">${o}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="btnrow"><button id="hear" class="btn secondary">♪ Beluister beide noten</button><button id="next" class="btn" disabled>Volgende interval →</button></div>`;$('#hear').onclick=()=>{playMidi(keyToMidi(a));setTimeout(()=>playMidi(keyToMidi(b)),550)}}
area.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>answerQuestion(kind,b));$('#next').onclick=()=>showQuestion(kind)}
function answerQuestion(kind,b){if(locked)return;locked=true;let good=b.dataset.value===question.answer;state.stats[kind].total++;if(good)state.stats[kind].right++;persist();$('#quizArea').querySelectorAll('.option').forEach(btn=>{btn.disabled=true;if(btn.dataset.value===question.answer)btn.classList.add('correct');else if(btn===b)btn.classList.add('wrong')});let f=$('#feedback');f.textContent=(good?'Juist! ':'Nog niet helemaal. ')+question.explain;f.classList.toggle('bad',!good);$('#next').disabled=false;let s=state.stats[kind];$('#progressStat').textContent=`${s.right} juist op ${s.total} beantwoorde vragen`;document.querySelector('.progressbar>div').style.width=Math.round(100*s.right/s.total)+'%'}
function notes(){quizLayout('notes','Leer de noten lezen','Kijk naar de notenbalk en kies de juiste naam. Wissel tussen sleutels en drie niveaus.',`<label class="field">Sleutel<select id="clefSelect"><option value="treble">Vioolsleutel</option><option value="bass">Bassleutel</option><option value="both">Allebei door elkaar</option></select></label><label class="field">Moeilijkheid<select id="levelSelect">${levels.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('')}</select></label>`);$('#clefSelect').value=state.clef||'treble';$('#levelSelect').value=state.level||'0';$('#clefSelect').onchange=()=>{state.clef=$('#clefSelect').value;persist();showQuestion('notes')};$('#levelSelect').onchange=()=>{state.level=$('#levelSelect').value;persist();showQuestion('notes')};showQuestion('notes')}
function rhythm(){quizLayout('rhythm','Ritme begrijpen','Reken met hele, halve, kwart-, achtste en gepunteerde noten. Een kwartnoot telt hier als één tel.','<span class="pill">Kwartnoot = 1 tel</span>');showQuestion('rhythm')}
function intervals(){quizLayout('intervals','Intervallen herkennen','Leer afstanden tussen noten lezen: van prime tot octaaf. Eerst de intervalnummers, later ook de precieze kwaliteit.','<span class="pill">Van prime tot octaaf</span>');showQuestion('intervals')}
function piano(){main.innerHTML=title('De pianohoek','Hoor waar de noten zitten. Klik op een toets en vergelijk de klank met de notenbalk.')+`<div class="panel"><h2>Van C4 tot C5</h2><p>De witte toetsen volgen C, D, E, F, G, A, B en opnieuw C. De zwarte toetsen verhogen of verlagen de toon met een halve toon.</p><div class="kbd" id="keyboard"></div><div id="keylabel" class="feedback" aria-live="polite">Kies een toets.</div><div id="pianostaff" class="staff-box">${staffSVG(0)}</div><div class="note">Tip: tussen E en F, en tussen B en C, zit geen zwarte toets. Dat is een belangrijke regel voor toonafstanden.</div></div>`;let el=$('#keyboard');const whites=[60,62,64,65,67,69,71,72],names=['C4','D4','E4','F4','G4','A4','B4','C5'];whites.forEach((m,i)=>{let k=document.createElement('div');k.className='whitekey';k.textContent=names[i];k.onclick=()=>{playMidi(m);$('#keylabel').textContent=names[i];$('#pianostaff').innerHTML=staffSVG(i);};el.append(k)});[{i:0,m:61,n:'C♯4'},{i:1,m:63,n:'D♯4'},{i:3,m:66,n:'F♯4'},{i:4,m:68,n:'G♯4'},{i:5,m:70,n:'A♯4'}].forEach(o=>{let k=document.createElement('div');k.className='blackkey';k.style.left=((o.i+1)/8*100-3.6)+'%';k.title=o.n;k.setAttribute('role','button');k.tabIndex=0;k.setAttribute('aria-label',o.n);const hit=()=>{playMidi(o.m);$('#keylabel').textContent=o.n+' (zwarte toets)';$('#pianostaff').innerHTML=staffSVG(o.i)};k.onclick=hit;k.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit()}};el.append(k)})}
function scores(){main.innerHTML=title('Partiturenlab','Hier gaan we later samen echte muziekstukken ontleden, zodat je beter begrijpt wat je speelt.')+`<section class="panel"><h2>Wat komt er in een volgende versie?</h2><div class="lesson-list"><div class="lesson"><strong>Partituur stap voor stap</strong><p>Een foto of pdf van een partituur bekijken en samen de noten, ritmes, toonaard, vingerzetting en moeilijke passages bespreken.</p></div><div class="lesson"><strong>Per maat oefenen</strong><p>Een moeilijke passage opdelen in kleine stukjes en die gericht inoefenen.</p></div><div class="lesson"><strong>Jouw repertoire</strong><p>Een bibliotheek met muziekstukken die jij wilt leren, zoals pianostukken van Yann Tiersen.</p></div></div><div class="note">Dit onderdeel is voorlopig een vooruitblik. De huidige app heeft nog geen uploadfunctie of automatische partituuranalyse. Voor analyse kun je ondertussen een partituur rechtstreeks in onze chat delen.</div><button class="btn" id="goTheory">Leer eerst de basis</button></section>`;$('#goTheory').onclick=()=>nav('theory')}
function render(page){({home,theory,notes,rhythm,intervals,piano,scores}[page]||home)();window.scrollTo({top:0,behavior:'instant'})}let initial=(location.hash||'#home').slice(1);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===initial));render(initial);window.addEventListener('hashchange',()=>{let page=(location.hash||'#home').slice(1);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render(page)});
</script></body></html>
